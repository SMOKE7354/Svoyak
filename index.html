<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свояк — Лобби</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .hub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .hub-panel {
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .hub-input {
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            background: #1a1a1a;
            border: 2px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 8px;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .hub-input:focus {
            border-color: var(--accent);
            outline: none;
        }
        .hub-roles {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .hub-btn {
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: all 0.2s;
        }
        .hub-btn-display { background: var(--accent); color: #000; }
        .hub-btn-host { background: var(--success); color: #fff; }
        .hub-btn-editor { background: #333; color: #fff; border: 1px solid var(--panel-border); }
        .hub-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="glass-panel hub-panel">
            <h1 class="glow-text" style="margin-bottom: 10px;">СВОЯ ИГРА</h1>
            <p class="subtitle">Введите код лобби для подключения или создания</p>
            
            <input type="text" id="room-input" class="hub-input" placeholder="КОД ЛОББИ" value="SVOYAK" maxlength="10">
            
            <div class="hub-roles">
                <button class="hub-btn hub-btn-display" onclick="joinRole('display')">📺 Экран зрителей (Табло)</button>
                <button class="hub-btn hub-btn-host" onclick="joinRole('host')">🎤 Панель ведущего</button>
                <button class="hub-btn hub-btn-editor" onclick="joinRole('editor')">✏️ Редактор вопросов</button>
            </div>
        </div>
    </div>

    <script>
        function joinRole(role) {
            const roomCode = document.getElementById('room-input').value.trim().toUpperCase() || 'SVOYAK';
            const params = '?room=' + encodeURIComponent(roomCode);
            
            if (role === 'display') window.location.href = 'display.html' + params;
            else if (role === 'host') window.location.href = 'host.html' + params;
            else if (role === 'editor') window.location.href = 'editor.html' + params;
        }
    </script>
</body>
</html>
