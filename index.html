<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свояк — Лобби</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .hub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .hub-panel {
            padding: 50px;
            max-width: 550px;
            width: 100%;
        }
        .hub-input {
            width: 100%;
            padding: 18px;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            background: #111;
            border: 2px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 12px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }
        .hub-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .hub-roles {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .hub-btn {
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--panel-border);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }
        .hub-btn-create {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            margin-bottom: 10px;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .hub-btn-display { background: #1a1a1a; color: var(--text-main); }
        .hub-btn-host { background: #1a1a1a; color: var(--text-main); }
        .hub-btn-editor { background: #1a1a1a; color: var(--text-main); }
        
        .hub-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            border-color: #555;
        }
        .hub-btn-create:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 15px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--panel-border);
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="glass-panel hub-panel">
            <h1 class="glow-text" style="margin-bottom: 15px; font-size: 3rem;">СВОЯ ИГРА</h1>
            <p class="subtitle" style="font-size: 1.1rem; margin-bottom: 30px;">Введите название лобби и нажмите Enter для запуска игры</p>
            
            <input type="text" id="room-input" class="hub-input" placeholder="НАЗВАНИЕ ЛОББИ" value="SVOYAK" maxlength="15" autocomplete="off">
            
            <div class="hub-roles">
                <button class="hub-btn hub-btn-create" onclick="createLobby()">Запустить лобби</button>
                
                <div class="divider">или присоединиться</div>
                
                <button class="hub-btn hub-btn-display" onclick="joinRole('display')">Экран зрителей</button>
                <button class="hub-btn hub-btn-host" onclick="joinRole('host')">Панель ведущего</button>
                <button class="hub-btn hub-btn-editor" onclick="joinRole('editor')">Редактор вопросов</button>
            </div>
        </div>
    </div>

    <script>
        const roomInput = document.getElementById('room-input');

        roomInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                createLobby();
            }
        });

        function getRoomCode() {
            return roomInput.value.trim().toUpperCase() || 'SVOYAK';
        }

        function createLobby() {
            const roomCode = getRoomCode();
            const params = '?room=' + encodeURIComponent(roomCode);
            
            // Open editor and display in new tabs
            window.open('editor.html' + params, '_blank');
            window.open('display.html' + params, '_blank');
            
            // Navigate current tab to host
            window.location.href = 'host.html' + params;
        }

        function joinRole(role) {
            const roomCode = getRoomCode();
            const params = '?room=' + encodeURIComponent(roomCode);
            
            if (role === 'display') window.location.href = 'display.html' + params;
            else if (role === 'host') window.location.href = 'host.html' + params;
            else if (role === 'editor') window.location.href = 'editor.html' + params;
        }
    </script>

    <div class="creator-signature">create by <span class="creator-name">Emoсion</span></div>
</body>
</html>
