<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Свояк — Лобби</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .hub-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .hub-panel {
            padding: 50px;
            max-width: 550px;
            width: 100%;
        }
        .hub-input {
            width: 100%;
            padding: 18px;
            font-size: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            background: #111;
            border: 2px solid var(--panel-border);
            color: var(--text-main);
            border-radius: 12px;
            margin-bottom: 30px;
            letter-spacing: 2px;
            transition: border-color 0.3s;
        }
        .hub-input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
        .hub-roles {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .hub-btn {
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--panel-border);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            font-family: var(--font-main);
        }
        .hub-btn-create {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            margin-bottom: 10px;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }
        .hub-btn-display { background: #1a1a1a; color: var(--text-main); }
        .hub-btn-host { background: #1a1a1a; color: var(--text-main); }
        .hub-btn-editor { background: #1a1a1a; color: var(--text-main); }
        
        .hub-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.2);
            border-color: #555;
        }
        .hub-btn-create:hover {
            border-color: var(--accent);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            margin: 15px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--panel-border);
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>
    <div class="hub-container">
        <div class="glass-panel hub-panel" id="auth-panel">
            <h1 class="glow-text" style="margin-bottom: 15px; font-size: 3rem;">СВОЯ ИГРА</h1>
            <p class="subtitle" style="font-size: 1.1rem; margin-bottom: 30px;">Введите ключ доступа для продолжения</p>
            
            <input type="text" id="key-input" class="hub-input" placeholder="КЛЮЧ ДОСТУПА" autocomplete="off">
            
            <div class="hub-roles">
                <button class="hub-btn hub-btn-create" onclick="checkKey()">Войти</button>
            </div>
            <p id="error-message" style="color: #ff4444; display: none; margin-top: 15px;"></p>
        </div>

        <div class="glass-panel hub-panel" id="lobby-panel" style="display: none;">
            <h1 class="glow-text" style="margin-bottom: 15px; font-size: 3rem;">УСПЕШНО</h1>
            <p class="subtitle" style="font-size: 1.2rem; margin-bottom: 15px;">Ваше лобби:</p>
            <h2 id="lobby-name" style="font-size: 2.5rem; color: var(--accent); margin-bottom: 30px; letter-spacing: 2px;"></h2>
            
            <div class="hub-roles">
                <button class="hub-btn hub-btn-create" onclick="launchLobby()">Запустить игру</button>
            </div>
        </div>
    </div>

    <script>
        // Хэши ключей (SHA-256). Украсть сами ключи из этого кода невозможно!
        const validHashes = {
            'd4273a0e90cf9b5781de189fb80cce906f8cbf35fdb9e4ea89a1f39d52cdea80': 'svoyak-1',
            'ac4226a3a6d066dac53cf0755063579b9e1b56971943efed6a003cb23cf80027': 'svoyak-2',
            'da2d6978104d30fb1074dc22aad55ae1692f48a9453505e1161df4ed19578860': 'svoyak-3',
            'abbc90d8ed7d0d576a47abb5951cbf40743e304425de8443a427b07912ff2455': 'svoyak-4',
            '1f6a3784ef080a83a3d9b0b920ab35bba212eda7206ff553afe4279698909aa2': 'svoyak-5'
        };
        let currentLobby = '';

        // Функция для создания SHA-256 хэша
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const keyInput = document.getElementById('key-input');
        keyInput.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                checkKey();
            }
        });

        async function checkKey() {
            const key = keyInput.value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-message');
            
            // Хэшируем введенный пользователем ключ
            const hash = await sha256(key);
            
            if (validHashes[hash]) {
                currentLobby = validHashes[hash];
                document.getElementById('auth-panel').style.display = 'none';
                document.getElementById('lobby-panel').style.display = 'block';
                document.getElementById('lobby-name').textContent = currentLobby.toUpperCase();
            } else {
                errorMsg.textContent = 'Неверный ключ доступа!';
                errorMsg.style.display = 'block';
                setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
            }
        }

        function launchLobby() {
            if (!currentLobby) return;
            const params = '?room=' + encodeURIComponent(currentLobby);
            
            // Открываем редактор и экран в новых вкладках
            window.open('editor.html' + params, '_blank');
            window.open('display.html' + params, '_blank');
            
            // Текущую вкладку переводим на панель ведущего
            window.location.href = 'host.html' + params;
        }
    </script>

    <div class="creator-signature">create by <span class="creator-name">Emoсion</span></div>
</body>
</html>
